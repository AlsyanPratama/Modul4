<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jualan Bolo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo"> PC PARTS STORE</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#products">Product</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>

    <section id="home" class="hero-section">
        <div class="hero-content">
            <h1>Upgrade PC, Maksimalkan Kanda <span class="highlight">Performa</span></h1>
        </div>
    </section>

    <section id="products" class="product-section">
        <h2>Products</h2>
        <div class="product-grid">
            
            <!-- 1. RAM sekarang udah dibungkus .card -->
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="RAM">
                <p>RAM</p>
            </div>

            <!-- 2. Kartu Grafis -->
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="kartu grafis">
                <p>Kartu Grafis</p>
            </div>

            <!-- 3. Prosesor (tag div ditutup dengan benar) -->
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Prosesor">
                <p>Prosesor</p>
            </div>

            <!-- 4. Tambahin 1 produk lagi biar genap 4 biji -->
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="SSD">
                <p>SSD</p>
            </div>

        </div> <!-- 5. PENUTUP product-grid DI SINI -->
    </section>

    <section id="About" class="about-section">
        <h2>About</h2>
        <p>Pilihan komponen untuk kebutuhan upgrade PC ta kanda.</p>
        <!-- 6. </div> nyasar yang di sini UDAH DIHAPUS -->
    </section>
</body>

</html>
